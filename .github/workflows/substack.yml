name: Update Substack articles
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays 05:17 UTC (09:17 Dubai)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: substack, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh article list
        run: python3 scripts/substack.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then echo "No new articles."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "README: refresh recent Substack articles"
          git push
