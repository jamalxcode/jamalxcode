# Repo admin jobs that Claude cloud sessions can't do directly (their proxy blocks
# repo creation and the Pages settings API). A session triggers this with
# workflow_dispatch; it runs on GitHub's side with the ADMIN_TOKEN secret.
#
# ADMIN_TOKEN: fine-grained personal access token, resource owner jamalxcode,
# "All repositories", permissions Administration, Contents, Pages and Workflows
# set to read and write, and Actions set to read (the release task downloads a
# run's build files).
name: Repo admin

on:
  workflow_dispatch:
    inputs:
      task:
        description: audit (read-only report on every repo; repo input is ignored) | create-repo | pages | domain | site (= all three) | settings | reset-domain (remove and re-add the domain to retry a stuck HTTPS certificate) | disable-pages (unpublish the Pages site) | archive (make the repo read-only and archived) | remove-domain (detach the custom domain; the site serves from owner.github.io/repo) | make-public (change a private repo to public) | make-private (change a public repo to private) | actions-check (read the repo's Actions token permissions; report in jamalxcode/repo-audit) | actions-allow-write (let workflow tokens write; fixes "Resource not accessible by integration" when a workflow publishes a release) | release (publish a release from a finished run's build files, given run_id and version)
        required: true
        default: site
      repo:
        description: Repository name, without owner
        required: true
      domain:
        description: Custom domain, e.g. foo.sala.company (pages/domain/site/reset-domain)
        required: false
      private:
        description: Create the repo as private (create-repo/site)
        required: false
        default: 'false'
      description:
        description: Repo description (optional, any task)
        required: false
      run_id:
        description: Workflow run whose build files to publish (release)
        required: false
      version:
        description: Version to publish, e.g. 3.3.0 or 3.3.0-beta.1 (a "-" makes it a prerelease) (release)
        required: false

permissions:
  contents: read

# The audit report goes to the private repo jamalxcode/repo-audit, never to a branch of this public repo.

concurrency:
  group: repo-admin-${{ inputs.repo }}
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ADMIN_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      TASK: ${{ inputs.task }}
      REPO: ${{ inputs.repo }}
      DOMAIN: ${{ inputs.domain }}
      PRIVATE: ${{ inputs.private }}
      DESCRIPTION: ${{ inputs.description }}
      RUN_ID: ${{ inputs.run_id }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check inputs and token
        run: |
          [ -n "$GH_TOKEN" ] || { echo "::error::ADMIN_TOKEN secret is not set"; exit 1; }
          [[ "$REPO" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad repo name: $REPO"; exit 1; }
          [[ -z "$DOMAIN" || "$DOMAIN" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "::error::bad domain: $DOMAIN"; exit 1; }
          [[ -z "$RUN_ID" || "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad run_id: $RUN_ID"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "::error::bad version: $VERSION"; exit 1; }
          case "$TASK" in audit|create-repo|pages|domain|site|settings|reset-domain|remove-domain|disable-pages|archive|make-public|make-private|actions-check|actions-allow-write|release) ;; *) echo "::error::unknown task: $TASK"; exit 1;; esac
          gh api user --jq '"token belongs to " + .login'

      - name: Audit all repositories (read-only)
        if: inputs.task == 'audit'
        run: |
          gh api --paginate "user/repos?affiliation=owner&per_page=100" \
            --jq '.[] | [.name, (if .private then "private" else "public" end), (if .archived then "ARCHIVED" else "active" end), (if .fork then "fork" else "own" end), .default_branch, (.pushed_at[0:10]), (.size|tostring), (.description // "-"), (.homepage // "-"), (if (.topics|length)>0 then (.topics|join(",")) else "-" end), (.has_pages|tostring), (.stargazers_count|tostring)] | @tsv' \
            | sort > repos.tsv
          echo "AUDIT name|vis|archived|fork|branch|pushed|kb|description|homepage|topics|has_pages|stars"
          while IFS=$'\t' read -r name vis arch fork br pushed kb desc home topics pages stars; do
            p="-"
            if [ "$pages" = "true" ]; then
              p=$(gh api "repos/$OWNER/$name/pages" --jq '"\(.build_type) cname=\(.cname // "-") https=\(.https_enforced) status=\(.status // "-")"' 2>/dev/null || echo "pages-error")
            fi
            wf=$(gh api "repos/$OWNER/$name/contents/.github/workflows?ref=$br" --jq '[.[].name]|join(",")' 2>/dev/null || echo "-")
            files=$(gh api "repos/$OWNER/$name/contents?ref=$br" --jq '[.[].name]|join(",")' 2>/dev/null | cut -c1-300 || echo "-")
            echo "AUDIT $name|$vis|$arch|$fork|$br|$pushed|$kb|$desc|$home|$topics|$p|$stars|wf=$wf|root=$files" | tee -a audit.txt
          done < repos.tsv
          # Logs can't be read from Claude cloud sessions, so publish the report to the PRIVATE
          # repo jamalxcode/repo-audit (created here if missing). It lists private repos and their
          # files, so it must never land in this public repo again.
          REPORT_REPO=repo-audit
          gh api "repos/$OWNER/$REPORT_REPO" --silent 2>/dev/null \
            || gh api user/repos -f name="$REPORT_REPO" -F private=true -F auto_init=true -f description="Private: repo audit reports written by the Repo admin workflow" --jq '"created " + .html_url'
          [ "$(gh api "repos/$OWNER/$REPORT_REPO" --jq .private)" = "true" ] || { echo "::error::$REPORT_REPO is not private; refusing to publish the report"; exit 1; }
          old=$(gh api "repos/$OWNER/$REPORT_REPO/contents/audit.txt" --jq .sha 2>/dev/null || true)
          args=(-f message="Repo audit $(date -u +%F)" -f content="$(base64 -w0 audit.txt)")
          [ -n "$old" ] && args+=(-f sha="$old")
          gh api -X PUT "repos/$OWNER/$REPORT_REPO/contents/audit.txt" "${args[@]}" --jq '"report: " + .content.html_url'
          # Remove the old public audit-report branch if it still exists (it once leaked this list).
          gh api "repos/$OWNER/jamalxcode/git/ref/heads/audit-report" --silent 2>/dev/null \
            && gh api -X DELETE "repos/$OWNER/jamalxcode/git/refs/heads/audit-report" && echo "deleted the public audit-report branch" || true

      - name: Create repository
        if: inputs.task == 'create-repo' || inputs.task == 'site'
        run: |
          if gh api "repos/$OWNER/$REPO" --silent 2>/dev/null; then
            echo "$OWNER/$REPO already exists"
          else
            gh api user/repos -f name="$REPO" -F private="$PRIVATE" -F auto_init=true -f description="$DESCRIPTION" --jq '"created " + .html_url'
          fi

      - name: Enable Pages (source = GitHub Actions)
        if: inputs.task == 'pages' || inputs.task == 'site'
        run: |
          if gh api "repos/$OWNER/$REPO/pages" --silent 2>/dev/null; then
            gh api -X PUT "repos/$OWNER/$REPO/pages" -f build_type=workflow
          else
            gh api -X POST "repos/$OWNER/$REPO/pages" -f build_type=workflow --silent
          fi
          gh api "repos/$OWNER/$REPO/pages" --jq '"pages: " + .build_type + " " + .html_url'

      - name: Detach custom domain (remove-domain)
        if: inputs.task == 'remove-domain'
        run: |
          echo '{"cname":null}' | gh api -X PUT "repos/$OWNER/$REPO/pages" --input - --silent
          gh api -X PATCH "repos/$OWNER/$REPO" -f homepage="https://$OWNER.github.io/$REPO/" --silent
          gh api "repos/$OWNER/$REPO/pages" --jq '{cname, html_url}'

      - name: Remove custom domain (reset-domain)
        if: inputs.task == 'reset-domain'
        run: |
          [ -n "$DOMAIN" ] || { echo "::error::reset-domain needs the domain input"; exit 1; }
          gh api "repos/$OWNER/$REPO/pages/health" --jq '.domain | {host, dns_resolves, is_pointed_to_github_pages_server, is_https_eligible, enforces_https, responds_to_https}' || true
          echo '{"cname":null}' | gh api -X PUT "repos/$OWNER/$REPO/pages" --input - --silent
          echo "custom domain removed; waiting before re-adding it"
          sleep 60

      - name: Set custom domain and enforce HTTPS
        if: inputs.domain != '' && (inputs.task == 'domain' || inputs.task == 'pages' || inputs.task == 'site' || inputs.task == 'reset-domain')
        run: |
          gh api -X PUT "repos/$OWNER/$REPO/pages" -f cname="$DOMAIN"
          # The certificate is issued only after DNS resolves, so HTTPS can take a few minutes.
          for i in $(seq 1 20); do
            if gh api -X PUT "repos/$OWNER/$REPO/pages" -F https_enforced=true --silent 2>/dev/null; then
              echo "HTTPS enforced"; break
            fi
            echo "certificate not ready yet ($i/20)"; sleep 30
          done
          gh api "repos/$OWNER/$REPO/pages" --jq '{cname, https_enforced, status, html_url}'

      - name: Unpublish the Pages site (disable-pages)
        if: inputs.task == 'disable-pages'
        run: |
          if gh api "repos/$OWNER/$REPO/pages" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$OWNER/$REPO/pages" --silent && echo "Pages unpublished for $REPO"
          else
            echo "$REPO has no Pages site"
          fi

      - name: Make repository public (make-public)
        if: inputs.task == 'make-public'
        run: |
          gh api -X PATCH "repos/$OWNER/$REPO" -F private=false --jq '"\(.full_name) private=\(.private)"'

      - name: Make repository private (make-private)
        if: inputs.task == 'make-private'
        run: |
          gh api -X PATCH "repos/$OWNER/$REPO" -F private=true --jq '"\(.full_name) private=\(.private)"'

      - name: Archive repository (archive)
        if: inputs.task == 'archive'
        run: |
          gh api -X PATCH "repos/$OWNER/$REPO" -F archived=true --jq '"\(.full_name) archived=\(.archived)"'

      - name: Actions token permissions (actions-check, actions-allow-write)
        if: inputs.task == 'actions-check' || inputs.task == 'actions-allow-write'
        run: |
          if [ "$TASK" = actions-allow-write ]; then
            gh api -X PUT "repos/$OWNER/$REPO/actions/permissions/workflow" -f default_workflow_permissions=write --silent
            echo "workflow tokens in $REPO may now write"
          fi
          {
            echo "Actions check for $OWNER/$REPO ($(date -u '+%F %H:%M') UTC)"
            gh api "repos/$OWNER/$REPO/actions/permissions" --jq '"actions enabled=\(.enabled) allowed_actions=\(.allowed_actions // "-")"'
            gh api "repos/$OWNER/$REPO/actions/permissions/workflow" --jq '"workflow token default=\(.default_workflow_permissions) can_approve_prs=\(.can_approve_pull_request_reviews)"'
            echo "rulesets:"; gh api "repos/$OWNER/$REPO/rulesets" --jq '.[] | "  \(.name) target=\(.target) enforcement=\(.enforcement)"' 2>/dev/null || echo "  (none or not readable)"
            echo "latest release:"; gh api "repos/$OWNER/$REPO/releases/latest" --jq '"  \(.tag_name) \(.published_at)"' 2>/dev/null || echo "  (none)"
          } | tee check.txt
          # Same private report repo as the audit (session can't read job logs).
          old=$(gh api "repos/$OWNER/repo-audit/contents/actions-$REPO.txt" --jq .sha 2>/dev/null || true)
          args=(-f message="Actions check $REPO" -f content="$(base64 -w0 check.txt)")
          [ -n "$old" ] && args+=(-f sha="$old")
          gh api -X PUT "repos/$OWNER/repo-audit/contents/actions-$REPO.txt" "${args[@]}" --jq '"report: " + .content.html_url' || true

      - name: Publish a release from a run's build files (release)
        if: inputs.task == 'release'
        run: |
          [ -n "$RUN_ID" ] && [ -n "$VERSION" ] || { echo "::error::release needs run_id and version"; exit 1; }
          TAG="v$VERSION"
          if gh api "repos/$OWNER/$REPO/releases/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG is already published"; exit 0
          fi
          read -r SHA CONCLUSION < <(gh api "repos/$OWNER/$REPO/actions/runs/$RUN_ID" --jq '"\(.head_sha) \(.conclusion)"')
          echo "run $RUN_ID: commit $SHA, conclusion $CONCLUSION"
          # Every job must have passed; the only failure allowed is the publish step itself.
          bad=$(gh api "repos/$OWNER/$REPO/actions/runs/$RUN_ID/jobs?filter=latest" --jq '[.jobs[] | select(.name != "publish") | select(.conclusion != "success") | select(([.steps[] | select(.conclusion == "failure") | .name]) != ["Publish release"]) | .name] | join(", ")')
          [ -z "$bad" ] || { echo "::error::run $RUN_ID didn't pass ($bad); not publishing"; exit 1; }
          # Only the build files of that run, which already passed its tests and
          # carry its Sigstore proof. Nothing is rebuilt here.
          mkdir files && cd files
          gh run download "$RUN_ID" -R "$OWNER/$REPO" -p "$REPO-$VERSION" \
            || { echo "::error::couldn't download the build files of run $RUN_ID named $REPO-$VERSION (does ADMIN_TOKEN have Actions: read?)"; exit 1; }
          find . -mindepth 2 -type f -exec mv {} . \; ; find . -mindepth 1 -type d -empty -delete
          ls -la
          [ -n "$(ls ./*.zip 2>/dev/null)" ] || { echo "::error::no build files in that run"; exit 1; }
          # Notes: that version's CHANGELOG section plus the repo's release notes, as its workflow does.
          gh api "repos/$OWNER/$REPO/contents/CHANGELOG.md?ref=$SHA" --jq .content | base64 -d > CHANGELOG.md 2>/dev/null || true
          gh api "repos/$OWNER/$REPO/contents/.github/release-notes.md?ref=$SHA" --jq .content | base64 -d > extra.md 2>/dev/null || true
          section() { awk -v v="## $1" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md 2>/dev/null; }
          NOTES=$(section "$VERSION"); [[ -n "${NOTES//[[:space:]]/}" ]] || NOTES=$(section "${VERSION%%-*}")
          { echo "## What's new"; echo; echo "$NOTES"; echo; cat extra.md 2>/dev/null; } > ../notes.md
          rm -f CHANGELOG.md extra.md
          PRE=""; [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          gh release create "$TAG" ./* -R "$OWNER/$REPO" --target "$SHA" --title "$REPO $TAG" --notes-file ../notes.md $PRE
          gh api "repos/$OWNER/$REPO/releases/tags/$TAG" --jq '"published " + .html_url + " (" + ([.assets[].name]|join(", ")) + ")"'

      - name: Set description and homepage
        if: inputs.description != '' || inputs.domain != ''
        run: |
          args=()
          [ -n "$DESCRIPTION" ] && args+=(-f description="$DESCRIPTION")
          [ -n "$DOMAIN" ] && args+=(-f homepage="https://$DOMAIN")
          gh api -X PATCH "repos/$OWNER/$REPO" "${args[@]}" --jq '{full_name, description, homepage}'
